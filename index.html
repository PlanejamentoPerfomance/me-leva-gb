<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<meta name="theme-color" content="#1F2E1A" />
<title>Me Leva GB — Ânfora</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800;900&family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700;9..144,900&family=Work+Sans:wght@400;500;600;700&display=swap" rel="stylesheet" />
<style>
  :root {
    --verde-mata: #1F2E1A;
    --amarelo-milho: #F2B705;
    --marrom-sabugo: #8C5E28;
    --verde-folha: #6B8E4E;
    --creme: #FFF8E7;

    --amarelo-claro: #FFD34E;
    --amarelo-escuro: #C8930A;

    --sombra-sm: 0 8px 22px rgba(0, 0, 0, 0.18);
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }

  body {
    font-family: "Work Sans", system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
    color: var(--creme);
    background: radial-gradient(120% 80% at 50% -10%, #2a3d22 0%, var(--verde-mata) 55%, #16210f 100%);
    background-attachment: fixed;
    min-height: 100dvh;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom);
  }

  .wrap { width: 100%; max-width: 560px; margin: 0 auto; padding: 20px 18px 40px; }

  header { text-align: center; padding: 6px 0 4px; }
  .kicker {
    display: inline-flex; align-items: center; gap: 8px;
    font-size: 0.72rem; font-weight: 700; letter-spacing: 0.18em; text-transform: uppercase;
    color: var(--amarelo-milho); background: rgba(242, 183, 5, 0.10);
    border: 1px solid rgba(242, 183, 5, 0.28); padding: 6px 14px; border-radius: 999px;
  }
  h1 {
    font-family: "Fraunces", Georgia, serif; font-weight: 900;
    font-size: clamp(1.9rem, 8vw, 2.7rem); line-height: 1.02;
    margin: 14px 0 4px; letter-spacing: -0.01em;
  }
  h1 .gb { color: var(--amarelo-milho); }
  .subtitle { margin: 0; color: rgba(255, 248, 231, 0.66); font-size: 0.92rem; font-weight: 500; }

  /* Marca Grupo Nova Era */
  .brand { display: flex; justify-content: center; margin-bottom: 14px; }
  .brand-chip {
    display: inline-flex; align-items: center;
    background: var(--creme); border-radius: 12px; padding: 8px 16px;
    box-shadow: var(--sombra-sm);
  }
  .brand-logo { height: clamp(26px, 8vw, 34px); width: auto; display: block; }

  /* ---------- HERÓI: ânfora gigante ---------- */
  .hero { position: relative; display: flex; justify-content: center; margin: 8px 0 2px; }
  .vessel-svg {
    width: auto; height: min(60vh, 480px); max-width: 100%;
    filter: drop-shadow(0 22px 34px rgba(0, 0, 0, 0.42)); overflow: visible;
  }
  /* KPI de % — mostrador circular executivo */
  .pct-badge {
    position: absolute; top: 2%; right: -1%;
    width: clamp(104px, 30vw, 150px); aspect-ratio: 1;
    display: grid; place-items: center;
    filter: drop-shadow(0 10px 22px rgba(0,0,0,0.30));
  }
  .pct-badge .gauge { position: absolute; inset: 0; width: 100%; height: 100%; transform: rotate(-90deg); }
  .pct-badge .gauge-disc { fill: #16210f; }
  .pct-badge .gauge-track { fill: none; stroke: rgba(255,248,231,0.14); stroke-width: 9; }
  .pct-badge .gauge-arc {
    fill: none; stroke: var(--amarelo-milho); stroke-width: 9; stroke-linecap: round;
    stroke-dasharray: 326.73; stroke-dashoffset: 326.73;
    transition: stroke-dashoffset 1.5s cubic-bezier(.16,1,.3,1);
  }
  .pct-badge .gauge-center { position: relative; text-align: center; line-height: 0.9; }
  .pct-badge .num {
    display: block; font-family: "Archivo", "Work Sans", sans-serif; font-weight: 800;
    font-size: clamp(1.9rem, 8.5vw, 2.9rem); color: var(--creme);
    font-variant-numeric: tabular-nums; letter-spacing: -0.02em;
  }
  .pct-badge .lbl {
    display: block; font-family: "Archivo", "Work Sans", sans-serif; font-weight: 700;
    font-size: 0.56rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: var(--amarelo-milho); margin-top: 5px;
  }
  @media (prefers-reduced-motion: reduce) { .pct-badge .gauge-arc { transition: none; } }

  /* ---------- Número gigante do Total CP ---------- */
  .total-block { text-align: center; margin-top: 2px; }
  .total-label {
    font-size: 0.74rem; font-weight: 700; letter-spacing: 0.2em; text-transform: uppercase;
    color: var(--verde-folha); margin-bottom: 2px;
  }
  .total-value {
    font-family: "Fraunces", Georgia, serif; font-weight: 900;
    font-size: clamp(2.6rem, 14vw, 4.2rem); line-height: 0.98; letter-spacing: -0.02em;
    color: var(--creme); text-shadow: 0 2px 0 rgba(0,0,0,0.15);
  }
  .total-value .cifrao { font-size: 0.5em; vertical-align: 0.28em; color: var(--amarelo-milho); margin-right: 2px; }
  .total-meta { margin-top: 8px; font-size: 0.92rem; color: rgba(255, 248, 231, 0.62); font-weight: 500; }
  .total-meta b { color: var(--creme); font-weight: 700; }

  .total-bar {
    margin: 16px auto 0; height: 14px; width: 100%; max-width: 340px;
    background: rgba(0,0,0,0.28); border-radius: 999px; overflow: hidden; border: 1px solid rgba(255,248,231,0.08);
  }
  .total-bar > span {
    display: block; height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--amarelo-escuro), var(--amarelo-milho) 60%, var(--amarelo-claro));
    transition: width 1.4s cubic-bezier(.16,1,.3,1);
  }

  /* ---------- Cards por canal ---------- */
  .channels { display: grid; grid-template-columns: 1fr; gap: 14px; margin-top: 26px; }
  .card {
    background: linear-gradient(180deg, rgba(255,248,231,0.07), rgba(255,248,231,0.03));
    border: 1px solid rgba(255,248,231,0.10); border-radius: 20px; padding: 18px 18px 16px; box-shadow: var(--sombra-sm);
  }
  .card-top { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; }
  .card-name { display: flex; align-items: center; gap: 9px; font-weight: 700; font-size: 1.02rem; letter-spacing: 0.02em; }
  .dot { width: 11px; height: 11px; border-radius: 50%; background: var(--amarelo-milho); box-shadow: 0 0 0 4px rgba(242,183,5,0.16); }
  .card[data-canal="Loja"] .dot { background: var(--verde-folha); box-shadow: 0 0 0 4px rgba(107,142,78,0.18); }
  .card-pct { font-family: "Fraunces", Georgia, serif; font-weight: 900; font-size: 1.5rem; color: var(--amarelo-milho); }
  .card[data-canal="Loja"] .card-pct { color: var(--verde-folha); }
  .card-value {
    font-family: "Fraunces", Georgia, serif; font-weight: 700;
    font-size: clamp(1.7rem, 8vw, 2.2rem); line-height: 1; margin: 10px 0 2px; letter-spacing: -0.01em;
  }
  .card-value .cifrao { font-size: 0.55em; vertical-align: 0.24em; color: var(--amarelo-milho); margin-right: 2px; }
  .card[data-canal="Loja"] .card-value .cifrao { color: var(--verde-folha); }
  .card-meta { font-size: 0.86rem; color: rgba(255,248,231,0.58); font-weight: 500; }
  .card-bar {
    margin-top: 14px; height: 10px; background: rgba(0,0,0,0.26);
    border-radius: 999px; overflow: hidden; border: 1px solid rgba(255,248,231,0.06);
  }
  .card-bar > span {
    display: block; height: 100%; width: 0%; border-radius: 999px;
    background: linear-gradient(90deg, var(--amarelo-escuro), var(--amarelo-milho)); transition: width 1.4s cubic-bezier(.16,1,.3,1);
  }
  .card[data-canal="Loja"] .card-bar > span { background: linear-gradient(90deg, #4e6e37, var(--verde-folha)); }

  .footer { text-align: center; margin-top: 24px; color: rgba(255,248,231,0.5); font-size: 0.8rem; }
  .cycle {
    display: inline-block; background: rgba(140,94,40,0.24); border: 1px solid rgba(140,94,40,0.5);
    color: #e8c89a; padding: 5px 12px; border-radius: 999px; font-weight: 600; margin-bottom: 8px;
  }
  .error-note {
    display: none; margin-top: 12px; font-size: 0.78rem; color: #f0b0a0;
    background: rgba(180, 60, 40, 0.14); border: 1px solid rgba(180,60,40,0.32); border-radius: 12px; padding: 8px 12px;
  }
  .error-note.show { display: block; }

  /* ---------- Seletor de ciclos ---------- */
  .cycles-nav {
    display: flex; gap: 8px; margin: 16px -18px 2px; padding: 4px 18px 8px;
    overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none;
    scroll-snap-type: x proximity;
  }
  .cycles-nav::-webkit-scrollbar { display: none; }
  .cycle-pill {
    flex: 0 0 auto; scroll-snap-align: start;
    font-family: "Work Sans", sans-serif; font-size: 0.82rem; font-weight: 700;
    letter-spacing: 0.02em; color: rgba(255,248,231,0.72);
    background: rgba(255,248,231,0.06); border: 1px solid rgba(255,248,231,0.16);
    padding: 9px 16px; border-radius: 999px; cursor: pointer; white-space: nowrap;
    transition: background .18s ease, color .18s ease, border-color .18s ease, transform .12s ease;
  }
  .cycle-pill:hover { background: rgba(255,248,231,0.10); }
  .cycle-pill:active { transform: scale(0.96); }
  .cycle-pill.active {
    background: var(--amarelo-milho); border-color: var(--amarelo-milho);
    color: var(--verde-mata); box-shadow: 0 6px 16px rgba(242,183,5,0.28);
  }

  @media (min-width: 480px) { .channels { grid-template-columns: 1fr 1fr; } .cycles-nav { justify-content: center; flex-wrap: wrap; } }
  @media (prefers-reduced-motion: reduce) { .total-bar > span, .card-bar > span { transition: none; } }
</style>
</head>

          <linearGradient id="liquidGrad" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#FFDA5C" />
            <stop offset="0.5" stop-color="#F2B705" />
            <stop offset="1" stop-color="#C8930A" />
          </linearGradient>
        </defs>

        <!-- tampa/domo -->
        <rect x="78" y="42" width="104" height="42" rx="21" fill="url(#vesselGrad)" stroke="#D8C79B" stroke-width="1.5"/>

        <!-- corpo da taça (fundo creme = "vazio") -->
        <path d="M106,88 L154,88
                 C 176,100 192,140 200,180
                 C 206,210 204,250 176,300
                 C 162,326 158,340 162,356
                 C 168,384 184,402 190,424
                 C 193,438 186,450 172,452
                 L 88,452
                 C 74,450 67,438 70,424
                 C 76,402 92,384 98,356
                 C 102,340 98,326 84,300
                 C 56,250 54,210 60,180
                 C 68,140 84,100 106,88 Z"
              fill="url(#vesselGrad)" stroke="#D8C79B" stroke-width="1.5"/>

        <!-- líquido dourado (recortado pela silhueta) -->
        <g clip-path="url(#liquidClip)">
          <rect id="liquidRect" x="0" y="520" width="260" height="0" fill="url(#liquidGrad)"/>
          <ellipse id="liquidSurface" cx="130" cy="520" rx="90" ry="6" fill="#FFE9A8" opacity="0"/>
        </g>

        <!-- contorno por cima do líquido, para manter a borda nítida -->
        <path d="M106,88 L154,88
                 C 176,100 192,140 200,180
                 C 206,210 204,250 176,300
                 C 162,326 158,340 162,356
                 C 168,384 184,402 190,424
                 C 193,438 186,450 172,452
                 L 88,452
                 C 74,450 67,438 70,424
                 C 76,402 92,384 98,356
                 C 102,340 98,326 84,300
                 C 56,250 54,210 60,180
                 C 68,140 84,100 106,88 Z"
              fill="none" stroke="#D8C79B" stroke-width="1.5"/>
      </svg>
    </div>

    <!-- Número gigante do Total CP -->
    <div class="total-block">
      <div class="total-label">Total CP realizado</div>
      <div class="total-value" id="total-value"><span class="cifrao">R$</span>0</div>
      <div class="total-meta">de <b id="total-meta">R$ 35.000.000</b> · meta total</div>
      <div class="total-bar"><span id="total-bar-fill"></span></div>
    </div>

    <!-- Cards por canal -->
    <div class="channels" id="channels">
      <div class="card" data-canal="VD">
        <div class="card-top">
          <div class="card-name"><span class="dot"></span> Canal VD</div>
          <div class="card-pct" id="vd-pct">0%</div>
        </div>
        <div class="card-value" id="vd-value"><span class="cifrao">R$</span>0</div>
        <div class="card-meta">Meta: <span id="vd-meta">R$ 22.000.000</span></div>
        <div class="card-bar"><span id="vd-bar"></span></div>
      </div>
      <div class="card" data-canal="Loja">
        <div class="card-top">
          <div class="card-name"><span class="dot"></span> Canal Loja</div>
          <div class="card-pct" id="loja-pct">0%</div>
        </div>
        <div class="card-value" id="loja-value"><span class="cifrao">R$</span>0</div>
        <div class="card-meta">Meta: <span id="loja-meta">R$ 13.000.000</span></div>
        <div class="card-bar"><span id="loja-bar"></span></div>
      </div>
    </div>

    <div class="footer">
      <div class="cycle" id="cycle">Ciclo —</div>
      <div>Atualizado a cada ciclo comercial.</div>
      <div class="error-note" id="error-note"></div>
    </div>
  </div>

<script>
  // ======================================================================
  // CONFIG — link do CSV publicado do Google Sheets.
  //
  // Estrutura da planilha (dois blocos lado a lado: VD à esquerda, Loja à direita;
  // linhas "Total" trazem a meta oficial de cada canal). Só se edita a coluna
  // "Realizado" de cada ciclo no dia a dia:
  //   Ciclos,Canal,Meta,Realizado,Ciclos,Canal,Meta,Realizado
  //   Ciclo 14,VD,"R$ 5.194.749,23","R$ 0,00",Ciclo 14,Loja,"R$ 2.014.001,00","R$ 0,00"
  //   ...
  //   Total,VD,"R$ 22.000.000,00",0,Total,Loja,"R$ 13.000.000,00",0
  // ======================================================================
  const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTPA0PWEM7KXtgRuzMPJGYQe_JEFXvGkAKjEOJ-vYx1ENjv_31mI-QoHWv2Cwc3JIDgUL6061c5QIfc/pub?output=csv";

  // Dados de exemplo (usados sem URL ou se o fetch falhar).
  // Metas reais da planilha-mestre; "realizado" fictício em rampa só p/ demo.
  const FALLBACK_DATA = {
    cycles: {
      14: { VD: { meta: 5194749.23, realizado: 4850000 }, Loja: { meta: 2014001, realizado: 1980000 } },
      15: { VD: { meta: 4067096.86, realizado: 3100000 }, Loja: { meta: 1690769, realizado: 1250000 } },
      16: { VD: { meta: 7191618.12, realizado: 2600000 }, Loja: { meta: 3355115, realizado: 900000 } },
      17: { VD: { meta: 5281554.73, realizado: 400000  }, Loja: { meta: 5513021, realizado: 120000 } }
    },
    totals: { VD: { meta: 22000000 }, Loja: { meta: 13000000 } }
  };

  const brl = new Intl.NumberFormat("pt-BR", { style: "currency", currency: "BRL", maximumFractionDigits: 0 });
  const brlNoSymbol = new Intl.NumberFormat("pt-BR", { maximumFractionDigits: 0 });
  const $ = (id) => document.getElementById(id);
  const clamp01 = (n) => Math.max(0, Math.min(1, n));

  function parseCSV(text) {
    text = text.replace(/^﻿/, "").trim();
    const rows = [];
    for (const raw of text.split(/\r?\n/)) {
      if (!raw.trim()) continue;
      const cells = []; let cur = "", inQ = false;
      for (let i = 0; i < raw.length; i++) {
        const c = raw[i];
        if (c === '"') { inQ = !inQ; continue; }
        if (c === "," && !inQ) { cells.push(cur); cur = ""; continue; }
        cur += c;
      }
      cells.push(cur);
      rows.push(cells.map((s) => s.trim()));
    }
    return rows;
  }

  function toNumber(v) {
    if (v == null) return 0;
    let s = String(v).trim();
    if (!s) return 0;
    s = s.replace(/[R$\s]/g, "");
    if (s.includes(",") && s.includes(".")) s = s.replace(/\./g, "").replace(",", ".");
    else if (s.includes(",")) s = s.replace(",", ".");
    const n = parseFloat(s);
    return isNaN(n) ? 0 : n;
  }

  // Normaliza o nome do canal para "VD" ou "Loja" (ou null se não reconhecer).
  function normCanal(v) {
    const s = (v || "").trim().toLowerCase();
    if (s === "vd") return "VD";
    if (s === "loja") return "Loja";
    return null;
  }

  // Lê a planilha varrendo cada linha em grupos de 4 colunas
  // [Ciclo, Canal, Meta, Realizado]. Assim funciona tanto no formato de dois
  // blocos lado a lado (VD | Loja, 8 colunas) quanto num bloco único (4 colunas).
  function dataFromRows(rows) {
    const out = { cycles: {}, totals: { VD: { meta: 0 }, Loja: { meta: 0 } } };
    for (const cells of rows) {
      for (let g = 0; g + 3 < cells.length; g += 4) {
        const c0 = (cells[g] || "").trim().toLowerCase();
        if (!c0 || c0 === "ciclo" || c0 === "ciclos") continue; // cabeçalho/vazio
        const canal = normCanal(cells[g + 1]);
        if (!canal) continue;
        const meta = toNumber(cells[g + 2]);
        const realizado = toNumber(cells[g + 3]);

        if (c0.startsWith("total")) {
          out.totals[canal] = { meta };
          continue;
        }
        const m = c0.match(/(\d+)/);        // aceita "14" ou "Ciclo 14"
        if (!m) continue;
        const n = m[1];
        if (!out.cycles[n]) out.cycles[n] = { VD: { meta: 0, realizado: 0 }, Loja: { meta: 0, realizado: 0 } };
        out.cycles[n][canal] = { meta, realizado };
      }
    }
    return out;
  }

  // Monta as visões: { geral, "14", "15", ... }, cada uma { VD:{meta,realizado}, Loja:{...} }.
  function buildViews(data) {
    const cycleKeys = Object.keys(data.cycles).sort((a, b) => (+a) - (+b));
    const views = {};
    for (const k of cycleKeys) views[k] = data.cycles[k];

    // Visão geral: meta oficial (linha Total) + soma dos realizados de todos os ciclos.
    const geral = { VD: { meta: 0, realizado: 0 }, Loja: { meta: 0, realizado: 0 } };
    for (const canal of ["VD", "Loja"]) {
      let somaMetaCiclos = 0, somaReal = 0;
      for (const k of cycleKeys) {
        somaMetaCiclos += data.cycles[k][canal].meta || 0;
        somaReal += data.cycles[k][canal].realizado || 0;
      }
      const metaOficial = (data.totals[canal] && data.totals[canal].meta) || somaMetaCiclos;
      geral[canal] = { meta: metaOficial, realizado: somaReal };
    }
    return { geral, views, cycleKeys };
  }

  function animateCount(el, target, prefixHTML) {
    const dur = 1400, start = performance.now();
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    if (reduce) { el.innerHTML = prefixHTML + brlNoSymbol.format(Math.round(target)); return; }
    function step(now) {
      const t = clamp01((now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      el.innerHTML = prefixHTML + brlNoSymbol.format(Math.round(target * eased));
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // Enche a taça de baixo pra cima. Área útil interna: y de ~452 (base) a ~88 (gargalo).
  // A superfície do líquido é recortada pela silhueta, então basta uma elipse larga.
  function fillVessel(pct) {
    const bottom = 452, top = 88;
    const target = clamp01(pct);
    const rect = $("liquidRect"), surf = $("liquidSurface");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    function apply(p) {
      const h = (bottom - top) * p;
      const y = bottom - h;
      rect.setAttribute("y", y);
      rect.setAttribute("height", h);
      if (p > 0.02) {
        surf.setAttribute("cy", y);
        surf.setAttribute("opacity", "0.85");
      } else {
        surf.setAttribute("opacity", "0");
      }
    }
    if (reduce) { apply(target); return; }
    const start = performance.now(), dur = 1600;
    function step(now) {
      const t = clamp01((now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      apply(target * eased);
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  // Mostrador circular de % (arco + número com contagem animada).
  const GAUGE_C = 2 * Math.PI * 52; // circunferência do arco (r=52)
  function setGauge(pct) {
    const p = clamp01(pct);
    const arc = $("gauge-arc"), num = $("badge-num");
    const reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    arc.style.strokeDashoffset = (GAUGE_C * (1 - p)).toFixed(2);
    const targetPct = Math.round(p * 100);
    if (reduce) { num.textContent = targetPct + "%"; return; }
    const dur = 1500, start = performance.now();
    function step(now) {
      const t = clamp01((now - start) / dur);
      const eased = 1 - Math.pow(1 - t, 3);
      num.textContent = Math.round(targetPct * eased) + "%";
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function render(data) {
    const vd = data.VD, loja = data.Loja;
    const totalMeta = (vd.meta || 0) + (loja.meta || 0);
    const totalReal = (vd.realizado || 0) + (loja.realizado || 0);
    const totalPct = totalMeta ? totalReal / totalMeta : 0;
    const vdPct = vd.meta ? vd.realizado / vd.meta : 0;
    const lojaPct = loja.meta ? loja.realizado / loja.meta : 0;

    fillVessel(totalPct);
    setGauge(totalPct);

    animateCount($("total-value"), totalReal, '<span class="cifrao">R$</span>');
    $("total-meta").textContent = brl.format(totalMeta);
    setTimeout(() => { $("total-bar-fill").style.width = (clamp01(totalPct) * 100) + "%"; }, 60);

    animateCount($("vd-value"), vd.realizado, '<span class="cifrao">R$</span>');
    $("vd-meta").textContent = brl.format(vd.meta);
    $("vd-pct").textContent = Math.round(vdPct * 100) + "%";
    setTimeout(() => { $("vd-bar").style.width = (clamp01(vdPct) * 100) + "%"; }, 120);

    animateCount($("loja-value"), loja.realizado, '<span class="cifrao">R$</span>');
    $("loja-meta").textContent = brl.format(loja.meta);
    $("loja-pct").textContent = Math.round(lojaPct * 100) + "%";
    setTimeout(() => { $("loja-bar").style.width = (clamp01(lojaPct) * 100) + "%"; }, 180);
  }

  function showError(msg) { const el = $("error-note"); el.textContent = msg; el.classList.add("show"); }

  async function fetchData() {
    if (!SHEET_CSV_URL) {
      showError("Usando dados de exemplo — configure SHEET_CSV_URL para dados reais.");
      return FALLBACK_DATA;
    }
    try {
      const url = SHEET_CSV_URL + (SHEET_CSV_URL.includes("?") ? "&" : "?") + "_cb=" + Date.now();
      const res = await fetch(url, { cache: "no-store" });
      if (!res.ok) throw new Error("HTTP " + res.status);
      const text = await res.text();
      const data = dataFromRows(parseCSV(text));
      if (!Object.keys(data.cycles).length) throw new Error("CSV sem ciclos válidos");
      return data;
    } catch (e) {
      showError("Não foi possível carregar a planilha (" + e.message + "). Mostrando dados de exemplo.");
      return FALLBACK_DATA;
    }
  }

  // Monta as pills do seletor e liga os cliques.
  function buildSelector(built) {
    const nav = $("cycles-nav");
    nav.innerHTML = "";
    const items = [{ key: "geral", label: "Visão geral", view: built.geral, chip: "Visão geral" }];
    for (const k of built.cycleKeys) {
      items.push({ key: k, label: "Ciclo " + k, view: built.views[k], chip: "Ciclo " + k });
    }
    let current = null;
    function select(item, animate) {
      if (current) current.classList.remove("active");
      current = item.el;
      current.classList.add("active");
      // ao clicar, garante que a pill ativa fique visível na barra rolável
      // (só na interação — no load evita rolar a página para baixo)
      if (animate) current.scrollIntoView({ block: "nearest", inline: "center", behavior: "smooth" });
      $("cycle").textContent = item.chip;
      render(item.view);
    }
    for (const item of items) {
      const btn = document.createElement("button");
      btn.className = "cycle-pill";
      btn.type = "button";
      btn.textContent = item.label;
      item.el = btn;
      btn.addEventListener("click", () => select(item, true));
      nav.appendChild(btn);
    }
    // estado inicial = Visão geral
    select(items[0], false);
  }

  (async function init() {
    const data = await fetchData();
    const built = buildViews(data);
    requestAnimationFrame(() => buildSelector(built));
  })();
</script>
